<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Sécurité - Connexion</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center">

    <!-- CONTENEUR PRINCIPAL -->
    <div id="app" class="w-full max-w-md p-6 bg-slate-800 rounded-xl shadow-xl border border-slate-700">
        
        <!-- SECTION CONNEXION -->
        <div id="login-section">
            <h1 class="text-2xl font-bold mb-6 text-center text-blue-400">Connexion Sécurité</h1>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Identifiant</label>
                    <input type="text" id="username" required class="w-full px-3 py-2 bg-slate-900 rounded border border-slate-700 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Mot de passe</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 bg-slate-900 rounded border border-slate-700 focus:outline-none focus:border-blue-500">
                </div>
                <button type="submit" class="w-full py-2 bg-blue-600 hover:bg-blue-700 rounded font-bold transition">Se connecter</button>
            </form>
            <p id="login-error" class="text-red-400 text-sm mt-3 text-center hidden"></p>
        </div>

        <!-- SECTION ADMIN DASHBOARD (Cachée par défaut) -->
        <div id="admin-dashboard" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold text-emerald-400">Panneau Admin</h1>
                <button onclick="logout()" class="px-3 py-1 bg-red-600 hover:bg-red-700 rounded text-sm">Déconnexion</button>
            </div>
            
            <div class="bg-slate-900 p-4 rounded border border-slate-700 mb-6">
                <h2 class="font-semibold mb-3 text-blue-300">Créer un compte Staff</h2>
                <form id="create-user-form" class="space-y-3">
                    <input type="text" id="new-username" placeholder="Nouvel identifiant" required class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700 text-sm">
                    <input type="password" id="new-password" placeholder="Mot de passe provisoire" required class="w-full px-3 py-2 bg-slate-800 rounded border border-slate-700 text-sm">
                    <button type="submit" class="w-full py-2 bg-emerald-600 hover:bg-emerald-700 rounded text-sm font-bold">Créer le membre</button>
                </form>
                <p id="create-msg" class="text-sm mt-2 text-center"></p>
            </div>
        </div>

        <!-- SECTION STAFF DASHBOARD (Cachée par défaut) -->
        <div id="staff-dashboard" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold text-blue-400">Espace Membre Staff</h1>
                <button onclick="logout()" class="px-3 py-1 bg-red-600 hover:bg-red-700 rounded text-sm">Déconnexion</button>
            </div>
            <p class="text-slate-300">Bienvenue sur votre espace opérationnel.</p>
        </div>

    </div>

    <!-- LOGIQUE FIREBASE & APPLICATION -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURATION FIREBASE (Remplacez par vos propres identifiants Firebase)
        const firebaseConfig = {
              apiKey: "AIzaSyDadRDW_xQER5YaF-Med4QtoS3uh8hTb0s",
              authDomain: "revo-secu-ville.firebaseapp.com",
              databaseURL: "https://revo-secu-ville-default-rtdb.europe-west1.firebasedatabase.app",
              projectId: "revo-secu-ville",
              storageBucket: "revo-secu-ville.firebasestorage.app",
              messagingSenderId: "426627296057",
              appId: "1:426627296057:web:48061734fd216cca3756e8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const adminDashboard = document.getElementById('admin-dashboard');
        const staffDashboard = document.getElementById('staff-dashboard');
        const loginError = document.getElementById('login-error');
        const createUserForm = document.getElementById('create-user-form');
        const createMsg = document.getElementById('create-msg');

        // Gestion de la connexion
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            loginError.classList.add('hidden');

            try {
                // Cas d'urgence/admin par défaut initial (optionnel si vous créez le premier admin dans Firestore)
                if (usernameInput === "admin" && passwordInput === "adminpassword") {
                    const adminUser = { username: "admin", role: "admin" };
                    localStorage.setItem('currentUser', JSON.stringify(adminUser));
                    checkSession();
                    return;
                }

                // Recherche dans Firestore
                const usersRef = collection(db, "users");
                const q = query(usersRef, where("username", "==", usernameInput), where("password", "==", passwordInput));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const userData = querySnapshot.docs[0].data();
                    localStorage.setItem('currentUser', JSON.stringify(userData));
                    checkSession();
                } else {
                    loginError.textContent = "Identifiant ou mot de passe incorrect.";
                    loginError.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                loginError.textContent = "Erreur de connexion à la base de données.";
                loginError.classList.remove('hidden');
            }
        });

        // Création d'un compte staff (Réservé à l'admin)
        createUserForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newUsername = document.getElementById('new-username').value.trim();
            const newPassword = document.getElementById('new-password').value.trim();

            try {
                await addDoc(collection(db, "users"), {
                    username: newUsername,
                    password: newPassword,
                    role: "staff",
                    createdAt: new Date().toISOString()
                });
                createMsg.textContent = "Membre créé avec succès !";
                createMsg.className = "text-sm mt-2 text-center text-emerald-400";
                createUserForm.reset();
            } catch (err) {
                console.error(err);
                createMsg.textContent = "Erreur lors de la création.";
                createMsg.className = "text-sm mt-2 text-center text-red-400";
            }
        });

        // Vérification de la session active au chargement
        window.checkSession = function() {
            const user = JSON.parse(localStorage.getItem('currentUser'));
            if (!user) {
                loginSection.classList.remove('hidden');
                adminDashboard.classList.add('hidden');
                staffDashboard.classList.add('hidden');
                return;
            }

            loginSection.classList.add('hidden');
            if (user.role === 'admin') {
                adminDashboard.classList.remove('hidden');
                staffDashboard.classList.add('hidden');
            } else {
                adminDashboard.classList.add('hidden');
                staffDashboard.classList.remove('hidden');
            }
        }

        window.logout = function() {
            localStorage.removeItem('currentUser');
            checkSession();
        }

        // Lancer la vérification au démarrage
        checkSession();
    </script>
</body>
</html>
